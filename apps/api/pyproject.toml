[project]
name = "skilleval-api"
version = "0.1.0"
description = "SkillEval backend: AI Agent / Skill trace ingestion, eval, and LLM judging"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"